<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Génesis — Admin</title>
  <style>
    :root{color:#211d19;background:#f5f1ea;font-family:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;padding:32px 18px 56px}main{max-width:1100px;margin:auto}h1{margin:0;font-size:2rem}h2{margin:0;font-size:1.35rem}.intro{color:#6a625b;margin:8px 0 28px}.card{background:#fff;border-radius:14px;padding:25px;margin-bottom:22px;box-shadow:0 4px 20px #221b1510}.hidden{display:none!important}.head,.actions,.nav,.checks{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:17px}.actions{margin-top:18px}.nav{border-bottom:1px solid #ddd4ca;margin-bottom:24px}.nav button{background:none;color:#625a52;border:0;border-radius:0;padding:10px 2px;margin-right:18px}.nav .active{color:#211d19;border-bottom:2px solid #211d19}.field{margin-bottom:13px}label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}input,select,textarea,button{font:inherit}input[type=text],input[type=password],input[type=number],input[type=time],select,textarea{width:100%;padding:10px;border:1px solid #cfc7bd;border-radius:7px;color:inherit;background:#fff}textarea{min-height:70px;resize:vertical}button{background:#211d19;color:#fff;border:1px solid #211d19;border-radius:7px;padding:10px 14px;cursor:pointer}button:hover{opacity:.85}button:disabled{opacity:.45;cursor:default}.secondary,.danger{background:#fff;color:#211d19;border-color:#cfc7bd}.danger{color:#a12d25}.status{min-height:1.3em;color:#625a52}.error{color:#a12d25}.login{max-width:460px}.category-row{display:grid;grid-template-columns:1fr 94px 42px;gap:10px;align-items:end;padding:11px 0;border-bottom:1px solid #eee8e2}.category-row .field{margin:0}.dish{border:1px solid #e5ddd4;border-radius:10px;margin:10px 0;overflow:hidden}.dish-head{display:flex;gap:10px;align-items:center;width:100%;border:0;border-radius:0;background:#fff;color:#211d19;text-align:left;padding:15px}.dish-head strong{flex:1}.dish-head small{color:#6a625b}.dish-form{padding:15px;border-top:1px solid #eee8e2}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.checks{margin:4px 0 15px}.check{display:flex;align-items:center;gap:7px;font-weight:400;margin:0}.check input{width:auto}.hours-row{display:grid;grid-template-columns:1fr 120px 120px 96px 42px;gap:10px;align-items:end;padding:11px 0;border-bottom:1px solid #eee8e2}.hours-row .field{margin:0}.empty{color:#6a625b}@media(max-width:720px){.card{padding:18px}.grid,.hours-row,.category-row{grid-template-columns:1fr}.category-row button,.hours-row button{width:100%}}
  </style>
</head>
<body>
<main>
  <h1>Génesis</h1><p class="intro">Pannello di amministrazione</p>
  <section id="login" class="card login">
    <h2>Accesso</h2><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="login-button">Accedi</button><p id="login-status" class="status" aria-live="polite"></p>
  </section>
  <section id="admin" class="hidden">
    <nav class="nav"><button class="tab active" data-panel="menu">Menu</button><button class="tab" data-panel="popup">Pop-up</button><button class="tab" data-panel="hours">Orari</button><button id="logout" class="secondary">Esci</button></nav>
    <div id="menu" class="panel">
      <section class="card"><div class="head"><h2>Categorie</h2><button id="add-category" class="secondary">+ Aggiungi categoria</button></div><p class="intro">Usa un nome breve: verrà usato come identificatore nel menu.</p><div id="categories"></div><div class="actions"><button id="save-categories">Salva categorie</button></div></section>
      <section class="card"><div class="head"><h2>Piatti</h2><button id="add-dish">+ Aggiungi piatto</button></div><div class="field" style="max-width:280px"><label for="filter">Mostra categoria</label><select id="filter"></select></div><div id="dishes"></div><div class="actions"><button id="save-dishes">Salva modifiche ai piatti</button></div></section>
    </div>
    <section id="popup" class="panel card hidden"><div class="head"><h2>Pop-up</h2><button id="add-popup">+ Aggiungi pop-up</button></div><p class="intro">Il pop-up appare sul sito solo se è pubblicato e rientra nell'eventuale periodo impostato.</p><div id="popups"></div><div class="actions"><button id="save-popups">Salva pop-up</button></div></section>
    <section id="hours" class="panel card hidden"><div class="head"><h2>Orari di apertura</h2><button id="add-hours" class="secondary">+ Aggiungi orario</button></div><div id="hours-list"></div><div class="actions"><button id="save-hours">Salva orari</button></div></section>
    <p id="status" class="status" aria-live="polite"></p>
  </section>
</main>
<script>
const API="https://genesis-api.cimiteroditarsia.workers.dev",q=s=>document.querySelector(s);
let token="",categories=[],dishes=[],popups=[];
const esc=v=>{const e=document.createElement("div");e.textContent=v||"";return e.innerHTML};
const cents=v=>v==null?"":(Number(v)/100).toFixed(2),toCents=v=>{const n=Number(String(v).replace(",","."));return Number.isFinite(n)?Math.round(n*100):null};
const dateValue=v=>v?String(v).replace(" ","T").slice(0,16):"";
function status(text="",error=false){q("#status").textContent=text;q("#status").classList.toggle("error",error)}
function headers(){return {"Content-Type":"application/json","Authorization":"Bearer "+token}}
async function api(path,opts={}){const r=await fetch(API+path,{credentials:"include",...opts,headers:{...headers(),...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Operazione non riuscita.");return d}
function options(selected){return categories.map(c=>'<option value="'+c.id+'" '+(Number(selected)===Number(c.id)?"selected":"")+">"+esc(c.slug)+"</option>").join("")}
function renderCategories(){
  q("#categories").innerHTML=categories.length?categories.map((c,i)=>'<div class="category-row" data-id="'+(c.id||"")+'"><div class="field"><label>Categoria</label><input data-key="slug" value="'+esc(c.slug)+'"></div><div class="field"><label>Ordine</label><input type="number" min="0" data-key="sort_order" value="'+(c.sort_order??i)+'"></div><button class="danger remove-category" title="Elimina">×</button></div>').join(""):'<p class="empty">Nessuna categoria.</p>';
  q("#filter").innerHTML='<option value="">Tutte le categorie</option>'+categories.map(c=>'<option value="'+c.id+'">'+esc(c.slug)+"</option>").join("");
}
function fields(d){
  const input=(label,key)=>'<div class="field"><label>'+label+'</label><input type="text" data-key="'+key+'" value="'+esc(d[key])+'"></div>';
  const area=(label,key)=>'<div class="field"><label>'+label+'</label><textarea data-key="'+key+'">'+esc(d[key])+'</textarea></div>';
  return '<div class="grid">'+input("Nome ES","name_es")+input("Nome EN","name_en")+input("Nome IT","name_it")+'<div class="field"><label>Categoria</label><select data-key="category_id">'+options(d.category_id)+'</select></div><div class="field"><label>Prezzo (€)</label><input type="text" inputmode="decimal" data-key="price" value="'+cents(d.price_cents)+'" placeholder="es. 7,50"></div><div class="field"><label>Ordine nella categoria</label><input type="number" min="0" data-key="sort_order" value="'+(d.sort_order??0)+'"></div>'+area("Descrizione ES","description_es")+area("Descrizione EN","description_en")+area("Descrizione IT","description_it")+'<div class="field"><label>Foto</label><input type="file" accept="image/jpeg,image/png,image/webp" data-key="image_file"><input type="hidden" data-key="image_key" value="'+esc(d.image_key)+'"><img class="dish-image '+(d.image_key?"":"hidden")+'" src="'+(d.image_key?API+"/api/images/"+encodeURIComponent(d.image_key):"")+'" alt="" style="display:block;max-width:150px;margin-top:8px;border-radius:7px"></div>'+"</div>";
}
function dishHtml(d={},fresh=false){return '<article class="dish" data-id="'+(d.id||"")+'"><button class="dish-head"><strong>'+esc(d.name_es||"Nuovo piatto")+'</strong><small>'+((cents(d.price_cents))?"€ "+cents(d.price_cents):"Senza prezzo")+'</small><span>⌄</span></button><form class="dish-form '+(fresh?"":"hidden")+'" onsubmit="return false">'+fields(d)+'<div class="checks"><label class="check"><input type="checkbox" data-key="available" '+(Number(d.available??1)?"checked":"")+'> Disponibile</label><label class="check"><input type="checkbox" data-key="vegetarian" '+(Number(d.vegetarian)?"checked":"")+'> Vegetariano</label><label class="check"><input type="checkbox" data-key="vegan" '+(Number(d.vegan)?"checked":"")+'> Vegano</label></div><button class="danger remove-dish">Elimina piatto</button></form></article>'}
function renderDishes(){const id=q("#filter").value,items=id?dishes.filter(d=>Number(d.category_id)===Number(id)):dishes;q("#dishes").innerHTML=items.length?items.map(d=>dishHtml(d)).join(""):'<p class="empty">Nessun piatto in questa categoria.</p>'}
function dishData(card){const val=k=>card.querySelector('[data-key="'+k+'"]').value.trim(),check=k=>card.querySelector('[data-key="'+k+'"]').checked?1:0;return{id:Number(card.dataset.id),category_id:Number(val("category_id"))||null,name_es:val("name_es"),name_en:val("name_en"),name_it:val("name_it"),description_es:val("description_es")||null,description_en:val("description_en")||null,description_it:val("description_it")||null,price_cents:toCents(val("price")),image_key:val("image_key")||null,sort_order:Number(val("sort_order"))||0,available:check("available"),vegetarian:check("vegetarian"),vegan:check("vegan")}}
async function loadMenu(){[categories,dishes]=await Promise.all([api("/api/admin/categories"),api("/api/admin/dishes")]);renderCategories();renderDishes()}
function popupMarkup(p={},fresh=false){const input=(label,key,type="text")=>'<div class="field"><label>'+label+'</label><input type="'+type+'" data-key="'+key+'" value="'+esc(type==="datetime-local"?dateValue(p[key]):p[key])+'"></div>',area=(label,key)=>'<div class="field"><label>'+label+'</label><textarea data-key="'+key+'">'+esc(p[key])+'</textarea></div>';return '<article class="dish" data-id="'+(p.id||'')+'"><button class="dish-head"><strong>'+esc(p.title_it||"Nuovo pop-up")+'</strong><small>'+(Number(p.published)?"Pubblicato":"Bozza")+'</small><span>⌄</span></button><form class="dish-form '+(fresh?"":"hidden")+'" onsubmit="return false"><div class="grid">'+input("Titolo ES","title_es")+input("Titolo EN","title_en")+input("Titolo IT","title_it")+area("Testo ES","text_es")+area("Testo EN","text_en")+area("Testo IT","text_it")+input("Testo pulsante ES","button_text_es")+input("Testo pulsante EN","button_text_en")+input("Testo pulsante IT","button_text_it")+input("Link pulsante","button_url")+input("Inizia il","starts_at","datetime-local")+input("Finisce il","ends_at","datetime-local")+'</div><div class="checks"><label class="check"><input type="checkbox" data-key="published" '+(Number(p.published)?"checked":"")+'> Pubblicato</label></div><button class="danger remove-popup">Elimina pop-up</button></form></article>'}
function popupData(card){const val=k=>card.querySelector('[data-key="'+k+'"]').value.trim();return{id:Number(card.dataset.id),title_es:val("title_es"),title_en:val("title_en"),title_it:val("title_it"),text_es:val("text_es")||null,text_en:val("text_en")||null,text_it:val("text_it")||null,button_text_es:val("button_text_es")||null,button_text_en:val("button_text_en")||null,button_text_it:val("button_text_it")||null,button_url:val("button_url")||null,starts_at:val("starts_at")||null,ends_at:val("ends_at")||null,published:card.querySelector('[data-key="published"]').checked?1:0}}
function renderPopups(){q("#popups").innerHTML=popups.length?popups.map(p=>popupMarkup(p)).join(""):'<p class="empty">Nessun pop-up creato.</p>'}
async function loadPopups(){popups=await api("/api/admin/popups");renderPopups()}
function hoursRow(h={}){const r=document.createElement("div");r.className="hours-row";r.dataset.id=h.id||"";r.innerHTML='<div class="field"><label>Giorno</label><input data-key="day_label" value="'+esc(h.day_label)+'"></div><div class="field"><label>Apertura</label><input type="time" data-key="open_time" value="'+(h.open_time||"")+'"></div><div class="field"><label>Chiusura</label><input type="time" data-key="close_time" value="'+(h.close_time||"")+'"></div><label class="check"><input type="checkbox" data-key="is_closed" '+(Number(h.is_closed)?"checked":"")+'> Chiuso</label><button class="danger remove-hours">×</button>';return r}
async function loadHours(){const list=q("#hours-list");list.innerHTML="";(await api("/api/opening-hours")).forEach(h=>list.append(hoursRow(h)))}
q("#login-button").onclick=async()=>{const pass=q("#password").value,box=q("#login-status");if(!pass){box.textContent="Inserisci la password.";return}try{const r=await fetch(API+"/api/admin/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass})}),d=await r.json();if(!r.ok)throw Error(d.error||"Accesso non riuscito.");token=d.session;q("#login").classList.add("hidden");q("#admin").classList.remove("hidden");await Promise.all([loadMenu(),loadHours(),loadPopups()])}catch(e){box.textContent=e.message;box.classList.add("error")}};
q("#password").onkeydown=e=>{if(e.key==="Enter")q("#login-button").click()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.add("hidden"));b.classList.add("active");q("#"+b.dataset.panel).classList.remove("hidden");status()});
q("#logout").onclick=()=>{token="";q("#admin").classList.add("hidden");q("#login").classList.remove("hidden")};
q("#add-category").onclick=()=>{categories.push({slug:"",sort_order:categories.length});renderCategories();q("#categories .category-row:last-child input").focus()};
q("#categories").onclick=async e=>{const b=e.target.closest(".remove-category");if(!b)return;const row=b.closest(".category-row");if(!row.dataset.id){row.remove();return}if(!confirm("Vuoi eliminare questa categoria? Può essere eliminata solo se non contiene piatti."))return;try{await api("/api/admin/categories?id="+encodeURIComponent(row.dataset.id),{method:"DELETE"});await loadMenu();status("Categoria eliminata.")}catch(err){status(err.message,true)}};
q("#save-categories").onclick=async()=>{try{const rows=[...document.querySelectorAll(".category-row")],old=rows.filter(r=>r.dataset.id).map(r=>({id:+r.dataset.id,slug:r.querySelector('[data-key="slug"]').value.trim(),sort_order:+r.querySelector('[data-key="sort_order"]').value||0})),fresh=rows.filter(r=>!r.dataset.id).map(r=>r.querySelector('[data-key="slug"]').value.trim()).filter(Boolean);if(old.some(c=>!c.slug))throw Error("Ogni categoria deve avere un nome.");if(old.length)await api("/api/admin/categories",{method:"PATCH",body:JSON.stringify(old)});for(const slug of fresh)await api("/api/admin/categories",{method:"POST",body:JSON.stringify({slug})});await loadMenu();status("Categorie salvate.")}catch(e){status(e.message,true)}};
q("#filter").onchange=renderDishes;
q("#add-dish").onclick=()=>{if(!categories.length){status("Crea prima una categoria.",true);return}const wrap=document.createElement("div");wrap.innerHTML=dishHtml({category_id:+q("#filter").value||categories[0].id,available:1},true);q("#dishes").prepend(wrap.firstElementChild)};
q("#dishes").onclick=async e=>{const head=e.target.closest(".dish-head");if(head){head.nextElementSibling.classList.toggle("hidden");return}const b=e.target.closest(".remove-dish");if(!b)return;const card=b.closest(".dish");if(!card.dataset.id){card.remove();return}if(!confirm("Vuoi eliminare questo piatto?"))return;try{await api("/api/admin/dishes?id="+encodeURIComponent(card.dataset.id),{method:"DELETE"});await loadMenu();status("Piatto eliminato.")}catch(err){status(err.message,true)}};
q("#dishes").onchange=async e=>{const input=e.target.closest('[data-key="image_file"]');if(!input||!input.files[0])return;const card=input.closest(".dish"),file=input.files[0];if(file.size>8*1024*1024){status("L'immagine non può superare 8 MB.",true);input.value="";return}try{status("Caricamento foto in corso...");const result=await api("/api/admin/images",{method:"POST",headers:{"Content-Type":file.type},body:file});card.querySelector('[data-key="image_key"]').value=result.key;const preview=card.querySelector(".dish-image");preview.src=result.url;preview.classList.remove("hidden");status("Foto caricata. Salva il piatto per associarla al menu.")}catch(err){status(err.message,true);input.value=""}};
q("#save-dishes").onclick=async()=>{try{const cards=[...document.querySelectorAll(".dish")],all=cards.map(dishData);if(all.some(d=>!d.name_es||!d.name_en||!d.name_it))throw Error("Inserisci il nome del piatto in tutte e tre le lingue.");const old=all.filter(d=>d.id),fresh=all.filter(d=>!d.id);if(old.length)await api("/api/admin/dishes",{method:"PATCH",body:JSON.stringify(old)});for(const d of fresh)await api("/api/admin/dishes",{method:"POST",body:JSON.stringify(d)});await loadMenu();status("Piatti salvati.")}catch(e){status(e.message,true)}};
q("#add-popup").onclick=()=>{const wrap=document.createElement("div");wrap.innerHTML=popupMarkup({},true);q("#popups").prepend(wrap.firstElementChild)};
q("#popups").onclick=async e=>{const head=e.target.closest(".dish-head");if(head){head.nextElementSibling.classList.toggle("hidden");return}const button=e.target.closest(".remove-popup");if(!button)return;const card=button.closest(".dish");if(!card.dataset.id){card.remove();return}if(!confirm("Vuoi eliminare questo pop-up?"))return;try{await api("/api/admin/popups?id="+encodeURIComponent(card.dataset.id),{method:"DELETE"});await loadPopups();status("Pop-up eliminato.")}catch(err){status(err.message,true)}};
q("#save-popups").onclick=async()=>{try{const all=[...document.querySelectorAll("#popups .dish")].map(popupData);if(all.some(p=>!p.title_es||!p.title_en||!p.title_it))throw Error("Inserisci il titolo in tutte e tre le lingue.");const old=all.filter(p=>p.id),fresh=all.filter(p=>!p.id);if(old.length)await api("/api/admin/popups",{method:"PATCH",body:JSON.stringify(old)});for(const p of fresh)await api("/api/admin/popups",{method:"POST",body:JSON.stringify(p)});await loadPopups();status("Pop-up salvati.")}catch(err){status(err.message,true)}};
q("#add-hours").onclick=()=>q("#hours-list").append(hoursRow());
q("#hours-list").onclick=async e=>{const b=e.target.closest(".remove-hours");if(!b)return;const row=b.closest(".hours-row");if(!row.dataset.id){row.remove();return}if(!confirm("Vuoi eliminare questo orario?"))return;try{await api("/api/admin/opening-hours?id="+row.dataset.id,{method:"DELETE"});row.remove();status("Orario eliminato.")}catch(err){status(err.message,true)}};
q("#save-hours").onclick=async()=>{try{const rows=[...document.querySelectorAll(".hours-row")],data=r=>({day_label:r.querySelector('[data-key="day_label"]').value.trim(),open_time:r.querySelector('[data-key="open_time"]').value||null,close_time:r.querySelector('[data-key="close_time"]').value||null,is_closed:r.querySelector('[data-key="is_closed"]').checked}),old=rows.filter(r=>r.dataset.id).map(r=>({id:+r.dataset.id,...data(r)}));if(old.length)await api("/api/admin/opening-hours",{method:"PATCH",body:JSON.stringify(old)});for(const r of rows.filter(r=>!r.dataset.id))await api("/api/admin/opening-hours",{method:"POST",body:JSON.stringify(data(r))});await loadHours();status("Orari salvati.")}catch(e){status(e.message,true)}};
</script>
</body>
</html>
