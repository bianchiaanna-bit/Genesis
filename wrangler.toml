name = "genesis-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "."          # sirve el sitio estático; /api/* y /img/* los gestiona worker.js
binding = "ASSETS"
run_worker_first = ["/api/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "genesis-db"
database_id = "604e77fb-af68-4a3b-923d-b5818c29036b"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "genesis-images"

# Secretos (no van en este archivo):
#   npx wrangler secret put ADMIN_PASSWORD      -> contraseña del propietario
#   npx wrangler secret put SESSION_SECRET      -> cadena larga aleatoria
